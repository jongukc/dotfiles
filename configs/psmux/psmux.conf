# Windows equivalent of configs/tmux/tmux.conf. Loaded as ~/.psmux.conf.
# No Unix ps/grep, Wayland hooks, xclip, or Bash-only TPM scripts.
set -g default-shell pwsh
set -g default-terminal "tmux-256color"
set -g prefix C-x
set -g base-index 1
set -s escape-time 0
set -g mouse on
set -g set-clipboard on
set -g status-keys vi
setw -g mode-keys vi

unbind C-b
bind C-x send-prefix
bind '\' split-window -h
bind - split-window -v
unbind '"'
unbind %
unbind o
bind r source-file ~/.psmux.conf

# Native format expressions replace Unix process inspection.
bind -n M-h if-shell -F '#{m:*vim*,#{pane_current_command}}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F '#{m:*vim*,#{pane_current_command}}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell -F '#{m:*vim*,#{pane_current_command}}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell -F '#{m:*vim*,#{pane_current_command}}' 'send-keys M-l' 'select-pane -R'
bind -n C-h previous-window
bind -n C-l next-window
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Native copy-selection also updates the Windows clipboard, without xclip.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

set -g status-position top
set -g status-style 'fg=#ced0d6,bg=default'
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#[fg=#74bc42,bold] #S #[fg=#ced0d6,nobold] | '
set -g status-right '%m/%d %H:%M:%S '
set -g window-status-format ' #I:#W'
set -g window-status-current-format '#[fg=#d9a82e,bold,underscore] #I:#W'
set -g message-style 'fg=#ced0d6,bg=default'
set -g pane-border-style 'fg=#474747'
set -g pane-active-border-style 'fg=#7eb0cc'
